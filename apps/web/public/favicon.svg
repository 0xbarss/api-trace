<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="#09090b" />
  <!-- Outer reticle ring -->
  <circle cx="16" cy="16" r="11" stroke="#27272a" stroke-width="1.2" />
  <!-- Sonar range ring -->
  <circle cx="16" cy="16" r="6.5" stroke="#059669" stroke-width="1" stroke-dasharray="2 1.5" stroke-opacity="0.7" />
  <!-- Reticle crosshair ticks -->
  <line x1="16" y1="2.5" x2="16" y2="6.5" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
  <line x1="16" y1="25.5" x2="16" y2="29.5" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
  <line x1="2.5" y1="16" x2="6.5" y2="16" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
  <line x1="25.5" y1="16" x2="29.5" y2="16" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
  <!-- Center radar hub -->
  <circle cx="16" cy="16" r="2" fill="#10b981" />
  <!-- Sweep vector line -->
  <line x1="16" y1="16" x2="22.5" y2="9.5" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" />
  <!-- Detected target ping probe -->
  <circle cx="22" cy="10" r="3.2" fill="#10b981" fill-opacity="0.3" />
  <circle cx="22" cy="10" r="1.6" fill="#6ee7b7" />
</svg>
